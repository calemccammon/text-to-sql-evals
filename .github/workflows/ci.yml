name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Stub Sweep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      # No API key, no network, no model SDK. The stub provider drives the whole
      # pipeline, so a regression in comparison or scoring fails here rather than
      # during a paid sweep.
      - name: Run tests
        run: uv run pytest tests/ -v

      # Regenerate the report from the committed run and check nothing moved.
      # Done before the smoke sweep, which must not overwrite committed results.
      - name: Fail if the committed report is stale
        run: |
          uv run python main.py report
          git diff --exit-code REPORT.md \
            || (echo "::error::REPORT.md is out of date with results/latest-run.json. Run: python main.py report" && exit 1)

      - name: Smoke-test the sweep end to end
        run: uv run python main.py run --model stub --dry-run
